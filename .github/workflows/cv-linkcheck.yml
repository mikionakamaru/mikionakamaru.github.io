# Temporário: confere se os links externos da /cv/ respondem. Some antes do merge.
name: "CV link check (temp)"
on:
  push:
    branches: [cv-updates]
    paths: [.github/workflows/cv-linkcheck.yml]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Testar URLs do cv.yml
        run: |
          grep -oE 'https://[^" ]+' _data/cv.yml | sort -u > urls.txt
          summary=""
          while read -r u; do
            code=$(curl -s -o body.html -w '%{http_code}' -L --max-time 25 "$u" || echo 000)
            title=$(grep -oiE '<title[^>]*>[^<]{0,90}' body.html | head -1 | sed 's/<[^>]*>//')
            id=$(echo "$u" | sed -nE 's#.*/mikionakamaru/([A-F0-9]+)\?.*#\1#p')
            if [ "$code" != "200" ]; then echo "::error::$code $u"; fi
            summary="$summary | ${id:-$(echo $u | cut -c9-60)} $code ${title:0:50}"
          done < urls.txt
          echo "::notice::${summary:0:3900}"
