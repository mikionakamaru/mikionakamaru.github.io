# Temporário: lê o transcript público do Microsoft Learn e grava um resumo na branch. Some antes do merge.
name: "CV transcript (temp)"
on:
  push:
    branches: [cv-updates]
    paths: [.github/workflows/cv-transcript.yml]
permissions:
  contents: write
jobs:
  read:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Ler transcript e gravar resumo
        run: |
          curl -fsSL "https://learn.microsoft.com/api/profiles/transcript/share/vnn42c6ool6ojrr?locale=en-us" -o /tmp/t.json
          python3 - <<'PY'
          import json
          d = json.load(open("/tmp/t.json"))
          cd = d.get("certificationData") or {}
          keep = ("name","certificationNumber","status","dateEarned","expiration","renewalStatus","examNumber","title","passedDate","certificationUid","credentialUrl","url")
          out = {}
          for g in ("activeCertifications","historicalCertifications","passedExams","qualifications"):
              out[g] = [{k: v for k, v in x.items() if k in keep or not isinstance(v, (dict, list))} for x in (cd.get(g) or [])]
          out["otherTopKeys"] = sorted(k for k in d if k != "certificationData")
          out["mct"] = {k: d[k] for k in d if "mct" in k.lower() or "trainer" in k.lower()}
          json.dump(out, open("_transcript-tmp.json", "w"), ensure_ascii=False, indent=1)
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add _transcript-tmp.json && git commit -m "tmp: resumo do transcript" && git push
