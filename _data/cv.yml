hero:
  role:
    pt: Especialista em segurança Microsoft
    en: Microsoft security specialist
  lead:
    pt: >-
      Trabalho numa operação MSSP cuidando de Sentinel, Defender XDR, Defender for Cloud,
      Purview e Entra ID de vários clientes ao mesmo tempo. Escrevo KQL pra caçar ameaça
      e PowerShell e Logic Apps pra tirar trabalho repetido da mão do analista.
    en: >-
      I work in an MSSP, running Sentinel, Defender XDR, Defender for Cloud, Purview and
      Entra ID for several clients at once. I write KQL to hunt threats, and PowerShell
      and Logic Apps to take repetitive work off the analyst's plate.
  location:
    pt: São José do Rio Preto, SP
    en: São José do Rio Preto, Brazil
  # Fatos curtos do hero. ref aponta pro número do cartão em #evidence.
  facts:
    - pt: "Em TI desde %since%"
      en: "In IT since %since%"
    - pt: "%active% certificações Microsoft ativas"
      en: "%active% active Microsoft certifications"
      ref: 1
    - pt: Microsoft Certified Trainer desde 2021
      en: Microsoft Certified Trainer since 2021
    - pt: Palestrei no MVP Conf e no TDC em 2026
      en: Spoke at MVP Conf and TDC in 2026
      ref: 2

about:
  - pt: >-
      Comecei em suporte e infraestrutura no Pará. Fui de analista a supervisor de TI,
      passei por SOC N1 e só depois entrei de vez em segurança. Hoje trabalho só com o
      ecossistema de segurança da Microsoft.
    en: >-
      I started in IT support and infrastructure in Pará, in northern Brazil. I went from
      analyst to IT supervisor, did a stint in a tier 1 SOC, and only then moved fully
      into security. These days I work only with Microsoft's security stack.
  - pt: >-
      Essa base de infra ajuda todo dia. Quando um alerta chega, eu sei como funcionam a
      máquina, a rede e a identidade que estão por trás dele.
    en: >-
      That infrastructure background pays off every day. When an alert fires, I know how
      the machine, the network and the identity behind it actually work.
  - pt: >-
      Também dou treinamento como MCT e conduzo workshops do programa MCI da Microsoft
      (Threat Protection e Cloud Security).
    en: >-
      I also teach as an MCT and run workshops for Microsoft's MCI program (Threat Protection
      and Cloud Security).

