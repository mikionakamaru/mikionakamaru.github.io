hero:
  role:
    pt: Especialista em segurança Microsoft
    en: Microsoft security specialist
  lead:
    pt: >-
      Trabalho numa operação MSSP cuidando de Sentinel, Defender XDR, Defender for Cloud,
      Purview e Entra ID de vários clientes ao mesmo tempo. Escrevo KQL pra caçar ameaça
      e PowerShell e Logic Apps pra tirar trabalho repetido da mão do analista.
    en: >-
      I work in an MSSP, running Sentinel, Defender XDR, Defender for Cloud, Purview and
      Entra ID for several clients at once. I write KQL to hunt threats, and PowerShell
      and Logic Apps to take repetitive work off the analyst's plate.
  location:
    pt: São José do Rio Preto, SP
    en: São José do Rio Preto, Brazil
  # Fatos curtos do hero. ref aponta pro número do cartão em #evidence.
  facts:
    - pt: "Em TI desde {since}"
      en: "In IT since {since}"
    - pt: "{exams} provas Microsoft aprovadas"
      en: "{exams} Microsoft exams passed"
      ref: 1
    - pt: Microsoft Certified Trainer desde 2021
      en: Microsoft Certified Trainer since 2021
      ref: 1
    - pt: Palestrei no MVP Conf e no TDC em 2026
      en: Spoke at MVP Conf and TDC in 2026
      ref: 2

about:
  - pt: >-
      Comecei em suporte e infraestrutura no Pará. Fui de analista a supervisor de TI,
      passei por SOC N1 e só depois entrei de vez em segurança. Hoje trabalho só com o
      ecossistema de segurança da Microsoft.
    en: >-
      I started in IT support and infrastructure in Pará, in northern Brazil. I went from
      analyst to IT supervisor, did a stint in a tier 1 SOC, and only then moved fully
      into security. These days I work only with Microsoft's security stack.
  - pt: >-
      Essa base de infra ajuda todo dia. Quando um alerta chega, eu sei como funcionam a
      máquina, a rede e a identidade que estão por trás dele.
    en: >-
      That infrastructure background pays off every day. When an alert fires, I know how
      the machine, the network and the identity behind it actually work.
  - pt: >-
      Também dou treinamento como MCT, conduzo workshops do programa MCI da Microsoft
      (Threat Protection e Cloud Security) e ajudei a fundar a
      <a href="https://jornada365.cloud/">Jornada 365</a>, comunidade de Microsoft 365
      em português.
    en: >-
      I also teach as an MCT, run workshops for Microsoft's MCI program (Threat Protection
      and Cloud Security), and co-founded <a href="https://jornada365.cloud/">Jornada 365</a>,
      a Portuguese-language Microsoft 365 community.

evidence:
  - n: 1
    url: https://learn.microsoft.com/en-us/users/mikionakamaru/transcript/vnn42c6ool6ojrr
    title:
      pt: Transcript oficial no Microsoft Learn
      en: Official Microsoft Learn transcript
    text:
      pt: Todas as provas e certificações, com data e situação atual, direto da Microsoft.
      en: Every exam and certification, with dates and current status, straight from Microsoft.
  - n: 2
    url: https://mikionakamaru.github.io/ragciso/
    title:
      pt: Demo da palestra no TDC São Carlos
      en: Live demo from my TDC São Carlos talk
    text:
      pt: >-
        A página do QR code que mostrei sem explicar nada no início de "Seu RAG tem mais
        acesso que o CISO". Quem escaneou caiu num aviso de quishing. Nenhum dado é coletado.
      en: >-
        The page behind the QR code I put on screen, without a word, at the start of my
        RAG talk. Whoever scanned it landed on a quishing warning. No data is collected.
  - n: 3
    url: https://github.com/mikionakamaru/Consultas-KQL-MicrosoftDefender-e-Sentinel
    title:
      pt: Consultas KQL pra Defender XDR e Sentinel
      en: KQL queries for Defender XDR and Sentinel
    text:
      pt: As queries de hunting que eu uso no trabalho, organizadas por domínio.
      en: The hunting queries I use at work, sorted by domain.
    extra_url: https://github.com/mikionakamaru/kql-lab-playground
    extra:
      pt: E um playground de KQL com dados simulados, pra quem está aprendendo.
      en: Plus a KQL playground with simulated data, for people learning the language.
  - n: 4
    url: https://github.com/mikionakamaru/Relatorio-Conformidade-Defender
    title:
      pt: Relatório de postura de endpoint no Defender
      en: Endpoint posture report for Defender
    text:
      pt: >-
        Queries de Advanced Hunting que viram um relatório que o gestor de TI do cliente
        lê sozinho, com status traduzido e ação recomendada em cada linha.
      en: >-
        Advanced Hunting queries that turn into a report a client's IT manager can read on
        their own, with translated status and a recommended action on every row.

stack:
