career:
  - company: SGA TI em Nuvem
    slug: sga
    initials: SGA
    start: { pt: jan/2026, en: Jan 2026 }
    end: null
    roles:
      - pt: Cybersecurity Specialist (PJ)
        en: Cybersecurity Specialist (contractor)
    points:
      - pt: >-
          Opero Sentinel, Defender XDR, Defender for Cloud, Purview e Entra ID de vários
          clientes ao mesmo tempo, via Azure Lighthouse. São empresas de saúde, financeiro,
          indústria e governo.
        en: >-
          I run Sentinel, Defender XDR, Defender for Cloud, Purview and Entra ID for several
          clients at once through Azure Lighthouse. They're in healthcare, finance,
          manufacturing and government.
      - pt: >-
          Implantei o Sentinel numa holding financeira com várias empresas: conectores de
          fontes diferentes, regras de detecção, workbooks e playbooks em Logic Apps.
        en: >-
          Rolled out Sentinel for a financial holding with several companies under it:
          connectors from different sources, detection rules, workbooks and Logic Apps playbooks.
      - pt: >-
          Conduzo workshops MCI de Cloud Security em ambientes com Azure, AWS e Google Cloud.
        en: >-
          I lead MCI Cloud Security workshops for environments spread across Azure, AWS and
          Google Cloud.
  - company: Avanade
    slug: avanade
    initials: AV
    start: { pt: jul/2022, en: Jul 2022 }
    end: { pt: mai/2026, en: May 2026 }
    roles:
      - pt: Analista de Segurança Cloud e Infraestrutura (CLT)
        en: Cloud and Infrastructure Security Analyst (full-time)
    points:
      - pt: >-
          Cuidei de um parque com mais de 70 mil dispositivos (Windows, Linux, Android e iOS)
          em Intune e Configuration Manager.
        en: >-
          Managed a fleet of more than 70,000 devices (Windows, Linux, Android and iOS) in
          Intune and Configuration Manager.
      - pt: >-
          Revisei 69 regras analíticas do Sentinel antes da mudança de nomenclatura de conta
          da Microsoft (jul/2026). 17 estavam ok e 52 precisaram de ajuste no KQL.
        en: >-
          Reviewed 69 Sentinel analytics rules ahead of Microsoft's account entity naming
          change (July 2026). 17 were fine, 52 needed KQL fixes.
      - pt: >-
          Numa empresa de energia de grande porte, implantei Defender for Endpoint em Linux
          e migrei os certificados SCEP via Intune pra atender ao KDC Strong.
        en: >-
          At a large energy company, deployed Defender for Endpoint on Linux and migrated
          SCEP certificates through Intune to meet KDC Strong authentication.
  - company: WorkDB Data Business
    slug: workdb
    initials: WDB
    start: { pt: jun/2020, en: Jun 2020 }
    end: { pt: jul/2022, en: Jul 2022 }
    roles:
      - pt: Analista de Segurança da Informação Pleno (nov/2021 a jul/2022)
        en: Information Security Analyst (Nov 2021 to Jul 2022)
      - pt: Analista de Suporte de TI Pleno (jun/2020 a nov/2021)
        en: IT Support Analyst (Jun 2020 to Nov 2021)
    points:
      - pt: Comecei no SOC N1, monitorando com Zabbix, Grafana e Elastic.
        en: Started in a tier 1 SOC, monitoring with Zabbix, Grafana and Elastic.
      - pt: >-
          Liderei a implantação interna do Intune e virei a referência da empresa na
          plataforma. Depois passei pra segurança: Entra ID (AD Connect, ADFS, MIM),
          compliance e migração de ambientes on-premises pro Azure.
        en: >-
          Led the company's own Intune rollout and became the go-to person for it. Then
          moved into security: Entra ID (AD Connect, ADFS, MIM), compliance policies and
          on-prem to Azure migrations.
  - company: Secretaria de Estado de Educação do Pará (SEDUC/PA)
