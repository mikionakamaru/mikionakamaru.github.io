      en: Every exam and certification, with dates and current status, straight from Microsoft.
  - n: 2
    url: https://mikionakamaru.github.io/carreira-em-y/
    title:
      pt: Páginas das minhas palestras
      en: Pages from my talks
    text:
      pt: >-
        Nas duas palestras eu abri com um QR code na tela, sem explicar nada. Quem escaneou
        caiu num aviso de quishing ligado ao tema da palestra. Nenhum dado é coletado.
      en: >-
        I opened both talks with a QR code on screen and no explanation. Whoever scanned it
        landed on a quishing warning tied to the talk's topic. No data is collected.
    links:
      - url: https://mikionakamaru.github.io/carreira-em-y/
        pt: MVP Conf 2026, carreira em Y
        en: MVP Conf 2026, the career fork
      - url: https://mikionakamaru.github.io/ragciso/
        pt: TDC São Carlos 2026, RAG e CISO
        en: TDC São Carlos 2026, RAG vs. CISO
  - n: 3
    url: https://github.com/mikionakamaru/Consultas-KQL-MicrosoftDefender-e-Sentinel
    title:
      pt: Consultas KQL pra Defender XDR e Sentinel
      en: KQL queries for Defender XDR and Sentinel
    text:
      pt: As queries de hunting que eu uso no trabalho, organizadas por domínio.
      en: The hunting queries I use at work, sorted by domain.
    extra_url: https://github.com/mikionakamaru/kql-lab-playground
    extra:
      pt: E um playground de KQL com dados simulados, pra quem está aprendendo.
      en: Plus a KQL playground with simulated data, for people learning the language.
  - n: 4
    url: https://github.com/mikionakamaru/Relatorio-Conformidade-Defender
    title:
      pt: Relatório de postura de endpoint no Defender
      en: Endpoint posture report for Defender
    text:
      pt: >-
        Queries de Advanced Hunting que viram um relatório que o gestor de TI do cliente
        lê sozinho, com status traduzido e ação recomendada em cada linha.
      en: >-
        Advanced Hunting queries that turn into a report a client's IT manager can read on
        their own, with translated status and a recommended action on every row.

