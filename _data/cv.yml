      - Microsoft Sentinel (SIEM/SOAR)
      - Defender XDR
      - Defender for Endpoint
      - Defender for Office 365
      - Defender for Identity
      - Defender Vulnerability Management
      - Security Exposure Management
      - Threat hunting (KQL)
  - group:
      pt: Nuvem e dados
      en: Cloud and data
    items:
      - Defender for Cloud (CSPM/CWPP)
      - Microsoft Purview (DLP, Information Protection)
      - Azure
      - Azure Arc
      - Azure Lighthouse
      - Log Analytics
  - group:
      pt: Identidade e endpoint
      en: Identity and endpoint
    items:
      - Microsoft Entra ID
      - Entra ID Protection
      - Conditional Access
      - Microsoft Intune
      - Configuration Manager (SCCM/MECM)
      - Jamf Pro
  - group:
