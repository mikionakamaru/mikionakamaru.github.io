career:
  - company: SGA TI em Nuvem
    slug: sga
    initials: SGA
    start: { pt: jan/2026, en: Jan 2026 }
    end: null
    roles:
      - pt: Cybersecurity Specialist (PJ)
        en: Cybersecurity Specialist (contractor)
    points:
      - pt: >-
          Opero Defender XDR, Defender for Cloud, Sentinel, Purview e Entra ID de vários
          clientes ao mesmo tempo, via Azure Lighthouse. São empresas de saúde, financeiro,
          indústria e governo.
        en: >-
          I run Defender XDR, Defender for Cloud, Sentinel, Purview and Entra ID for several
          clients at once through Azure Lighthouse. They're in healthcare, finance,
          manufacturing and government.
      - pt: >-
          Avalio a maturidade de segurança de cada cliente e desenho a arquitetura em Zero
          Trust, usando NIST, MITRE ATT&CK e o Cloud Adoption Framework como régua.
        en: >-
          I assess each client's security maturity and design the architecture around Zero
          Trust, using NIST, MITRE ATT&CK and the Cloud Adoption Framework as the yardstick.
      - pt: >-
          Investigo incidentes e faço threat hunting em KQL. O que se repete vira automação
          em PowerShell ou playbook em Logic Apps.
        en: >-
          I investigate incidents and hunt threats in KQL. Anything that repeats becomes a
          PowerShell script or a Logic Apps playbook.
      - pt: >-
          Implantei o Sentinel numa holding financeira com várias empresas: conectores de
          fontes diferentes, regras de detecção, workbooks e playbooks.
        en: >-
          Rolled out Sentinel for a financial holding with several companies under it:
          connectors from different sources, detection rules, workbooks and playbooks.
      - pt: >-
          Conduzo workshops MCI da Microsoft (Threat Protection e Cloud Security), inclusive
          em ambientes com Azure, AWS e Google Cloud, e escrevo a documentação técnica e a
          executiva de cada entrega.
        en: >-
          I lead Microsoft MCI workshops (Threat Protection and Cloud Security), including
          environments spread across Azure, AWS and Google Cloud, and write the technical
          and executive documentation for each delivery.
  - company: Avanade
    slug: avanade
    initials: AV
    start: { pt: jul/2022, en: Jul 2022 }
    end: { pt: mai/2026, en: May 2026 }
    roles:
      - pt: Analista de Segurança Cloud e Infraestrutura (CLT)
        en: Cloud and Infrastructure Security Analyst (full-time)
    points:
      - pt: >-
          Cuidei de um parque com mais de 70 mil dispositivos (Windows, Linux, Android e iOS)
          em Intune e Configuration Manager: aplicações, conformidade, configuração e
          atualização.
        en: >-
          Managed more than 70,000 devices (Windows, Linux, Android and iOS) in Intune and
          Configuration Manager: apps, compliance, configuration and updates.
      - pt: >-
          Implantei e administrei Defender for Endpoint, Defender for Office 365, Defender
          for Cloud, Sentinel, Entra ID e Defender Vulnerability Management, com investigação
          de incidente, hardening e gestão de vulnerabilidade.
        en: >-
          Deployed and ran Defender for Endpoint, Defender for Office 365, Defender for
          Cloud, Sentinel, Entra ID and Defender Vulnerability Management, covering incident
          investigation, hardening and vulnerability management.
      - pt: >-
          Revisei 69 regras analíticas do Sentinel antes da mudança de nomenclatura de conta
          da Microsoft (jul/2026). 17 estavam ok e 52 precisaram de ajuste no KQL.
        en: >-
          Reviewed 69 Sentinel analytics rules ahead of Microsoft's account entity naming
          change (July 2026). 17 were fine, 52 needed KQL fixes.
      - pt: >-
          Numa empresa de energia de grande porte, implantei Defender for Endpoint em Linux
          e migrei os certificados SCEP via Intune pra atender ao KDC Strong.
        en: >-
          At a large energy company, deployed Defender for Endpoint on Linux and migrated
          SCEP certificates through Intune to meet KDC Strong authentication.
      - pt: >-
          Conduzi workshops MCI de Threat Protection pra bancos e indústria e sustentei
          Microsoft 365 e Azure (Exchange Online, SharePoint, Teams, Azure Monitor, Log
