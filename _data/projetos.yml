      pt: Revisei 69 regras antes da mudança da Microsoft na entidade de conta (jul/2026). 17 estavam conformes e 52 precisaram de ajuste no KQL. Padronizei AccountName, UPNSuffix e NormalizedAccountName pra alertas e automações seguirem funcionando.
