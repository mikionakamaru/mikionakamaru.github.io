  - id: farma-sentinel-alerta-sem-incidente-2026
    ordem: "2026-11"   # AAAA-MM do fim do projeto, pra ordenar
    empresa: Consultoria
    periodo: { pt: 2026, en: 2026 }
    ano: 2026
    setor: { pt: Indústria, en: Industry }
    titulo:
      pt: "Alerta gerado, incidente sumido: onde o alerta do Sentinel morre no portal unificado"
      en: "Alert fired, incident missing: where a Sentinel alert dies in the unified portal"
    resumo:
      pt: Diagnóstico de uma analytic rule do Sentinel que gerava alerta mas não abria incidente no portal unificado do Defender. Segui o alerta etapa por etapa com KQL, descartei coleta, configuração e alert tuning, achei a etapa em que ele se perdia e restabeleci a criação de incidentes, validando com um novo teste.
      en: Troubleshooting a Sentinel analytic rule that fired alerts but never opened incidents in the Defender unified portal. Traced the alert step by step with KQL, ruled out data collection, configuration and alert tuning, found the stage where it was lost and restored incident creation, validated with a new test.
    tags: [Sentinel, Defender XDR, KQL]
    destaque: false
    artigo: /posts/alerta-gerado-incidente-sumido/

  - id: farma-php2shell-hunting-2026
    ordem: "2026-11"   # AAAA-MM do fim do projeto, pra ordenar
    empresa: Consultoria
    periodo: { pt: 2026, en: 2026 }
    ano: 2026
    setor: { pt: Indústria, en: Industry }
    titulo:
      pt: "Zero alertas não é zero ataque: threat hunting de uma falha crítica do PHP"
      en: "Zero alerts is not zero attacks: threat hunting for a critical PHP flaw"
    resumo:
      pt: Threat hunting de uma vulnerabilidade crítica do PHP com execução remota de código. Cruzei logs de firewall no SIEM com a telemetria do EDR, descartei os falsos positivos e conferi se o ambiente tinha como enxergar o ataque antes de concluir. Entreguei relatório executivo e plano de ação.
      en: Threat hunting for a critical PHP remote code execution flaw. Correlated firewall logs in the SIEM with EDR telemetry, ruled out false positives and checked whether the environment could actually see the attack before drawing a conclusion. Delivered an executive report and action plan.
    tags: [Threat Hunting, KQL, Sentinel, Defender XDR]
    artigo: /posts/zero-alertas-nao-e-zero-ataque/
    destaque: false

  - id: industria-mma-ama-diagnostico-2026
    ordem: "2026-10"   # AAAA-MM do fim do projeto, pra ordenar
    empresa: Consultoria
    periodo: { pt: 2026, en: 2026 }
    ano: 2026
    setor: { pt: Indústria, en: Industry }
    titulo:
      pt: "Do MMA para o AMA: como mapear o que ainda depende do agente antigo antes de desligá-lo"
      en: "From MMA to AMA: mapping what still depends on the old agent before retiring it"
    resumo:
      pt: Diagnóstico da aposentadoria do Microsoft Monitoring Agent (MMA), substituído pelo Azure Monitor Agent (AMA), num ambiente com Sentinel e Defender for Endpoint. Cruzei Heartbeat, regras de coleta (DCR), Azure Resource Graph e Advanced Hunting para mostrar onde o MMA ainda era necessário e o que o substitui. Entreguei um relatório HTML interativo com plano de ação, procedimentos de remediação e exportação para Excel.
      en: Diagnosis for retiring the Microsoft Monitoring Agent (MMA), replaced by the Azure Monitor Agent (AMA), in an environment running Sentinel and Defender for Endpoint. Correlated Heartbeat, data collection rules (DCR), Azure Resource Graph and Advanced Hunting to show where MMA was still needed and what replaces it. Delivered an interactive HTML report with an action plan, remediation procedures and Excel export.
    tags: [MMA, AMA, DCR, Sentinel, KQL, Defender for Endpoint]
    destaque: false
    artigo: /posts/do-mma-para-o-ama/

  - id: farma-sentinel-nishang-falso-positivo-2026
    ordem: "2026-10"   # AAAA-MM do fim do projeto, pra ordenar
    empresa: Consultoria
    periodo: { pt: 2026, en: 2026 }
    ano: 2026
    setor: { pt: Indústria, en: Industry }
    titulo:
      pt: "Quando o alerta vem do próprio EDR: revisão de uma regra do Sentinel que casava texto aleatório"
      en: "When the alert comes from the EDR itself: reviewing a Sentinel rule that matched random text"
    resumo:
      pt: Analisei em segundo nível um alerta de alta severidade de uma regra que buscava cmdlets do Nishang em linhas de comando. Decodifiquei o parâmetro em base64 que disparou o alerta e mostrei que era o próprio Defender for Endpoint fazendo descoberta de dispositivos. Redesenhei a regra pra buscar termo inteiro, exigir PowerShell e ler os comandos do AMSI, com teste positivo antes de publicar.
      en: I performed a tier-2 analysis of a high-severity alert from a rule that looked for Nishang cmdlets in command lines. I decoded the base64 parameter that triggered it and showed it was Defender for Endpoint itself running device discovery. I redesigned the rule to match whole terms, require PowerShell and read AMSI commands, with a positive test before publishing.
    tags: [Sentinel, KQL, Defender for Endpoint, Defender XDR, MITRE ATT&CK]
    destaque: false
    artigo: /posts/quando-o-alerta-vem-do-proprio-edr/

  - id: farma-defender-assinatura-fallback-intune-2026
    ordem: "2026-11"   # AAAA-MM do fim do projeto, pra ordenar
    empresa: Consultoria
    periodo: { pt: 2026, en: 2026 }
    ano: 2026
    setor: { pt: Indústria, en: Industry }
    titulo:
      pt: "Defender sem atualizar: fallback de assinatura e remediação pelo Intune que diz por onde atualizou"
      en: "Defender not updating: signature fallback and an Intune remediation that reports which source worked"
    resumo:
      pt: Revisão do fallback de atualização de assinatura do Microsoft Defender num parque gerenciado por Configuration Manager. Levantei o que impede a fonte externa de funcionar na prática e escrevi scripts de detecção e remediação pro Intune que tentam as fontes na ordem configurada, informam qual funcionou ou onde falhou e devolvem o resultado em uma linha pronta pra CSV.
      en: Review of Microsoft Defender signature update fallback in a fleet managed by Configuration Manager. Mapped what keeps the external source from working in practice and wrote Intune detection and remediation scripts that try each source in the configured order, report which one worked or where it failed, and return the result as a single CSV-ready line.
    tags: [Defender for Endpoint, Intune, Configuration Manager, PowerShell]
    destaque: false
