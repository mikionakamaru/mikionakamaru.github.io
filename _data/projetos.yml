  - id: farma-php2shell-hunting-2026
    ordem: "2026-11"   # AAAA-MM do fim do projeto, pra ordenar
    empresa: Consultoria
    periodo: { pt: 2026, en: 2026 }
    ano: 2026
    setor: { pt: Indústria, en: Industry }
    titulo:
      pt: "Zero alertas não é zero ataque: threat hunting de uma falha crítica do PHP"
      en: "Zero alerts is not zero attacks: threat hunting for a critical PHP flaw"
    resumo:
      pt: Threat hunting de uma vulnerabilidade crítica do PHP com execução remota de código. Cruzei logs de firewall no SIEM com a telemetria do EDR, descartei os falsos positivos e conferi se o ambiente tinha como enxergar o ataque antes de concluir. Entreguei relatório executivo e plano de ação.
      en: Threat hunting for a critical PHP remote code execution flaw. Correlated firewall logs in the SIEM with EDR telemetry, ruled out false positives and checked whether the environment could actually see the attack before drawing a conclusion. Delivered an executive report and action plan.
    tags: [Threat Hunting, KQL, Sentinel, Defender XDR]
    destaque: false

  - id: industria-mma-ama-diagnostico-2026
    ordem: "2026-10"   # AAAA-MM do fim do projeto, pra ordenar
    empresa: Consultoria
    periodo: { pt: 2026, en: 2026 }
    ano: 2026
    setor: { pt: Indústria, en: Industry }
    titulo:
      pt: "Do MMA para o AMA: como mapear o que ainda depende do agente antigo antes de desligá-lo"
      en: "From MMA to AMA: mapping what still depends on the old agent before retiring it"
    resumo:
      pt: Diagnóstico da aposentadoria do Microsoft Monitoring Agent (MMA), substituído pelo Azure Monitor Agent (AMA), num ambiente com Sentinel e Defender for Endpoint. Cruzei Heartbeat, regras de coleta (DCR), Azure Resource Graph e Advanced Hunting para mostrar onde o MMA ainda era necessário e o que o substitui. Entreguei um relatório HTML interativo com plano de ação, procedimentos de remediação e exportação para Excel.
      en: Diagnosis for retiring the Microsoft Monitoring Agent (MMA), replaced by the Azure Monitor Agent (AMA), in an environment running Sentinel and Defender for Endpoint. Correlated Heartbeat, data collection rules (DCR), Azure Resource Graph and Advanced Hunting to show where MMA was still needed and what replaces it. Delivered an interactive HTML report with an action plan, remediation procedures and Excel export.
    tags: [MMA, AMA, DCR, Sentinel, KQL, Defender for Endpoint]
    destaque: false
    artigo: /posts/do-mma-para-o-ama/
