      pt: Resposta a um 0-day do Outlook com KQL e Intune Remediations
      en: Responding to an Outlook 0-day with KQL and Intune Remediations
    resumo:
      pt: Medi a exposição real comparando o build do Office de cada máquina com a tabela oficial de cada canal, contornando um falso negativo do painel do Defender. Corrigi o parque com scripts de detecção e correção no Intune, em ondas com grupos de dispositivos.
      en: Measured real exposure by comparing each device's Office build against Microsoft's per-channel table, working around a false negative in the Defender dashboard. Remediated the fleet with Intune detection and remediation scripts, rolled out in waves using device groups.
    tags: [Intune, Remediations, KQL, Defender Vulnerability Management, Microsoft 365 Apps]
    destaque: false
    artigo: /posts/o-defender-disse-zero/

