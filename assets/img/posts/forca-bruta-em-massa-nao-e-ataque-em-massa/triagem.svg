<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 430" width="900" height="430" font-family="Montserrat, Segoe UI, sans-serif">
  <rect width="900" height="430" rx="14" fill="#0e1013"/>
  <text x="450" y="38" text-anchor="middle" fill="#e8eaed" font-size="18" font-weight="700">Antes de olhar a conta, olhe de onde veio a falha</text>
  <defs><marker id="s" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#71E4D1"/></marker></defs>
  <rect x="330" y="62" width="240" height="56" rx="10" fill="#15181d" stroke="#71E4D1" stroke-width="2"/>
  <text x="450" y="86" text-anchor="middle" fill="#71E4D1" font-size="14" font-weight="700">Lista de contas com alerta</text>
  <text x="450" y="106" text-anchor="middle" fill="#cfd3d8" font-size="12">de força bruta</text>
  <g stroke="#71E4D1" stroke-width="2" fill="none" marker-end="url(#s)">
    <path d="M450,120 L450,140 L155,140 L155,160"/>
    <path d="M450,120 L450,160"/>
    <path d="M450,120 L450,140 L745,140 L745,160"/>
  </g>
  <g font-size="12.5" text-anchor="middle">
    <rect x="20" y="164" width="270" height="170" rx="10" fill="#15181d" stroke="#4BB1EA" stroke-width="2"/>
    <text x="155" y="190" fill="#4BB1EA" font-size="15" font-weight="700">Local</text>
    <text x="155" y="214" fill="#F6F183" font-family="Consolas, monospace">127.0.0.1</text>
    <text x="155" y="234" fill="#cfd3d8">Unlock, Interactive,</text>
    <text x="155" y="252" fill="#cfd3d8">CachedInteractive</text>
    <text x="155" y="280" fill="#cfd3d8">usuário errando a senha</text>
    <text x="155" y="298" fill="#cfd3d8">no desbloqueio, depois acerta</text>
    <text x="155" y="322" fill="#71E4D1" font-weight="700">quase sempre ruído</text>

    <rect x="315" y="164" width="270" height="170" rx="10" fill="#15181d" stroke="#F6F183" stroke-width="2"/>
    <text x="450" y="190" fill="#F6F183" font-size="15" font-weight="700">Interna</text>
    <text x="450" y="214" fill="#F6F183" font-family="Consolas, monospace">OldPassword</text>
    <text x="450" y="234" fill="#cfd3d8">vindo de servidor, impressora,</text>
    <text x="450" y="252" fill="#cfd3d8">sessão esquecida, serviço</text>
    <text x="450" y="280" fill="#cfd3d8">milhares de falhas, sempre</text>
    <text x="450" y="298" fill="#cfd3d8">das mesmas origens</text>
    <text x="450" y="322" fill="#F6F183" font-weight="700">higiene, não ataque</text>

    <rect x="610" y="164" width="270" height="170" rx="10" fill="#15181d" stroke="#F97066" stroke-width="3"/>
    <text x="745" y="190" fill="#F97066" font-size="15" font-weight="700">Externa</text>
    <text x="745" y="214" fill="#F6F183" font-family="Consolas, monospace">50126 / 50053</text>
    <text x="745" y="234" fill="#cfd3d8">dezenas de IPs no exterior,</text>
    <text x="745" y="252" fill="#cfd3d8">uma tentativa por IP</text>
    <text x="745" y="280" fill="#cfd3d8">provedores de hospedagem</text>
    <text x="745" y="298" fill="#cfd3d8">e proxy residencial</text>
    <text x="745" y="322" fill="#F97066" font-weight="700">password spray: prioridade</text>
  </g>
  <rect x="20" y="356" width="860" height="54" rx="10" fill="#15181d" stroke="#2a2f36"/>
  <text x="450" y="380" text-anchor="middle" fill="#cfd3d8" font-size="13">Só a coluna da direita pede ação na conta. As outras duas pedem conversa com o usuário ou com quem cuida do servidor.</text>
  <text x="450" y="399" text-anchor="middle" fill="#8a9099" font-size="11.5">Exemplo genérico, sem dados de ambiente real.</text>
</svg>
