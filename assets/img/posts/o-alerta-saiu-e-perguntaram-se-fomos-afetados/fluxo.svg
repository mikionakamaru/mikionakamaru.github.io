<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" width="900" height="400" font-family="Montserrat, Segoe UI, sans-serif">
  <rect width="900" height="400" rx="14" fill="#0e1013"/>
  <text x="450" y="38" text-anchor="middle" fill="#e8eaed" font-size="18" font-weight="700">Do alerta público à resposta com evidência</text>
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#71E4D1"/></marker></defs>
  <g stroke="#71E4D1" stroke-width="2" fill="none" marker-end="url(#a)">
    <path d="M176,120 L196,120"/><path d="M352,120 L372,120"/><path d="M528,120 L548,120"/><path d="M704,120 L724,120"/>
  </g>
  <g font-size="12" text-anchor="middle">
    <rect x="20" y="70" width="156" height="100" rx="10" fill="#15181d" stroke="#4BB1EA" stroke-width="2"/>
    <text x="98" y="96" fill="#4BB1EA" font-size="14" font-weight="700">1. Ler</text>
    <text x="98" y="120" fill="#cfd3d8">fonte primária</text><text x="98" y="138" fill="#cfd3d8">inteira, mais a</text><text x="98" y="156" fill="#cfd3d8">segunda fonte</text>
    <rect x="196" y="70" width="156" height="100" rx="10" fill="#15181d" stroke="#9C7AD2" stroke-width="2"/>
    <text x="274" y="96" fill="#9C7AD2" font-size="14" font-weight="700">2. Extrair</text>
    <text x="274" y="120" fill="#cfd3d8">indicadores</text><text x="274" y="138" fill="#cfd3d8">por tipo: IP, URL,</text><text x="274" y="156" fill="#cfd3d8">User-Agent, alerta</text>
    <rect x="372" y="70" width="156" height="100" rx="10" fill="#15181d" stroke="#F97066" stroke-width="3"/>
    <text x="450" y="96" fill="#F97066" font-size="14" font-weight="700">3. Checar o campo</text>
    <text x="450" y="120" fill="#cfd3d8">o log registra</text><text x="450" y="138" fill="#cfd3d8">esse indicador?</text><text x="450" y="156" fill="#F6F183" font-weight="700">o passo que se pula</text>
    <rect x="548" y="70" width="156" height="100" rx="10" fill="#15181d" stroke="#71E4D1" stroke-width="2"/>
    <text x="626" y="96" fill="#71E4D1" font-size="14" font-weight="700">4. Buscar</text>
    <text x="626" y="120" fill="#cfd3d8">entrada e saída,</text><text x="626" y="138" fill="#cfd3d8">na maior janela</text><text x="626" y="156" fill="#cfd3d8">da retenção</text>
    <rect x="724" y="70" width="156" height="100" rx="10" fill="#15181d" stroke="#F6F183" stroke-width="2"/>
    <text x="802" y="96" fill="#F6F183" font-size="14" font-weight="700">5. Responder</text>
    <text x="802" y="120" fill="#cfd3d8">resultado, limite</text><text x="802" y="138" fill="#cfd3d8">e ruído separado</text><text x="802" y="156" fill="#cfd3d8">do tema</text>
  </g>
  <text x="450" y="216" text-anchor="middle" fill="#e8eaed" font-size="15" font-weight="700">Cada indicador termina em um de três estados</text>
  <g font-size="12.5" text-anchor="middle">
    <rect x="60" y="238" width="240" height="120" rx="10" fill="#15181d" stroke="#F97066" stroke-width="2"/>
    <text x="180" y="266" fill="#F97066" font-size="15" font-weight="700">Encontrei</text>
    <text x="180" y="294" fill="#cfd3d8">vira investigação,</text><text x="180" y="312" fill="#cfd3d8">com hora, origem e destino</text>
    <rect x="330" y="238" width="240" height="120" rx="10" fill="#15181d" stroke="#71E4D1" stroke-width="2"/>
    <text x="450" y="266" fill="#71E4D1" font-size="15" font-weight="700">Não encontrei</text>
    <text x="450" y="290" fill="#cfd3d8">e o log enxergaria</text>
    <text x="450" y="318" fill="#71E4D1" font-weight="700">resultado que vale</text>
    <rect x="600" y="238" width="240" height="120" rx="10" fill="#15181d" stroke="#F6F183" stroke-width="2"/>
    <text x="720" y="266" fill="#F6F183" font-size="15" font-weight="700">Não encontrei</text>
    <text x="720" y="290" fill="#cfd3d8">e o log não enxerga</text>
    <text x="720" y="318" fill="#F6F183" font-weight="700">limite, vai escrito na resposta</text>
  </g>
</svg>
