<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 330" width="900" height="330" font-family="Montserrat, Arial, sans-serif">
  <rect width="900" height="330" rx="14" fill="#0e1013"/>
  <text x="40" y="44" fill="#e8eaed" font-size="20" font-weight="700">Rollout em ondas, sempre com grupos de dispositivos</text>
  <g>
    <rect x="40" y="80" width="250" height="170" rx="12" fill="#12221f" stroke="#71E4D1" stroke-width="2"/>
    <text x="165" y="114" fill="#71E4D1" font-size="17" font-weight="700" text-anchor="middle">Onda 1</text>
    <text x="165" y="146" fill="#e8eaed" font-size="14" text-anchor="middle">Include: TI-Piloto</text>
    <text x="165" y="172" fill="#9aa0a6" font-size="13" text-anchor="middle">24 a 48 h de observação</text>
    <text x="165" y="198" fill="#9aa0a6" font-size="13" text-anchor="middle">lê o output do detect</text>
  </g>
  <text x="310" y="170" fill="#9aa0a6" font-size="26">→</text>
  <g>
    <rect x="345" y="80" width="250" height="170" rx="12" fill="#121c26" stroke="#4BB1EA" stroke-width="2"/>
    <text x="470" y="114" fill="#4BB1EA" font-size="17" font-weight="700" text-anchor="middle">Onda 2</text>
    <text x="470" y="146" fill="#e8eaed" font-size="14" text-anchor="middle">Include: parque</text>
    <text x="470" y="172" fill="#F97066" font-size="14" text-anchor="middle">Exclude: Diretoria</text>
    <text x="470" y="198" fill="#9aa0a6" font-size="13" text-anchor="middle">Hourly, intervalo 1</text>
  </g>
  <text x="615" y="170" fill="#9aa0a6" font-size="26">→</text>
  <g>
    <rect x="650" y="80" width="210" height="170" rx="12" fill="#1c1626" stroke="#9C7AD2" stroke-width="2"/>
    <text x="755" y="114" fill="#9C7AD2" font-size="17" font-weight="700" text-anchor="middle">Onda 3</text>
    <text x="755" y="146" fill="#e8eaed" font-size="14" text-anchor="middle">Remove o Exclude</text>
    <text x="755" y="172" fill="#9aa0a6" font-size="13" text-anchor="middle">logo em seguida,</text>
    <text x="755" y="198" fill="#9aa0a6" font-size="13" text-anchor="middle">sem intervalo longo</text>
  </g>
  <rect x="40" y="270" width="820" height="40" rx="8" fill="#1a1d22"/>
  <text x="450" y="295" fill="#F6F183" font-size="14" text-anchor="middle">Include de dispositivo com exclude de usuário: o Intune não garante a exclusão.</text>
</svg>
