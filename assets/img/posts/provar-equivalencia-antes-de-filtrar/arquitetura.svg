<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 380" role="img" aria-labelledby="t d">
<title id="t">Ambiente típico: firewall com zonas, log em CEF, Splunk e Sentinel</title>
<desc id="d">Três zonas de origem (corporativa, servidores e visitantes) passam pelo firewall. O log segue em CEF para o Splunk, onde a regra original roda, e para o Sentinel, na tabela CommonSecurityLog, onde a regra nova gera incidente agrupado por IP e aciona um playbook.</desc>
<rect width="900" height="380" rx="14" fill="#0e1013"/>
<g font-family="Montserrat,Segoe UI,Arial,sans-serif" font-size="14" fill="#e8eaee" text-anchor="middle">
<rect x="20" y="50" width="150" height="48" rx="8" fill="#161b22" stroke="#4bb1ea"/><text x="95" y="80">Zona corporativa</text>
<rect x="20" y="166" width="150" height="48" rx="8" fill="#161b22" stroke="#9c7ad2"/><text x="95" y="196">Zona de servidores</text>
<rect x="20" y="282" width="150" height="48" rx="8" fill="#161b22" stroke="#71e4d1"/><text x="95" y="312">Zona de visitantes</text>
<rect x="230" y="120" width="140" height="140" rx="10" fill="#222833" stroke="#8b93a1"/>
<text x="300" y="180" font-weight="700">Firewall</text><text x="300" y="202" font-size="12" fill="#b8bfcb">de próxima geração</text>
<rect x="430" y="40" width="190" height="86" rx="10" fill="#161b22" stroke="#f6f183"/>
<text x="525" y="68" font-weight="700" fill="#f6f183">Splunk (antigo)</text><text x="525" y="92">regra original</text><text x="525" y="110" font-size="12" fill="#b8bfcb">throttle por IP</text>
<rect x="430" y="254" width="190" height="86" rx="10" fill="#161b22" stroke="#4bb1ea"/>
<text x="525" y="282" font-weight="700" fill="#4bb1ea">Sentinel (novo)</text><text x="525" y="306">CommonSecurityLog</text><text x="525" y="324" font-size="12" fill="#b8bfcb">regra em KQL + filtro</text>
<rect x="680" y="254" width="200" height="86" rx="10" fill="#161b22" stroke="#71e4d1"/>
<text x="780" y="282" font-weight="700" fill="#71e4d1">Incidente</text><text x="780" y="306">agrupado por IP</text><text x="780" y="324" font-size="12" fill="#b8bfcb">+ playbook</text>
<rect x="680" y="40" width="200" height="86" rx="10" fill="#161b22" stroke="#f6f183" stroke-dasharray="5 4"/>
<text x="780" y="68" font-weight="700" fill="#f6f183">Alerta + webhook</text><text x="780" y="92">o que roda hoje</text><text x="780" y="110" font-size="12" fill="#b8bfcb">referência pra comparar</text>
<g stroke="#8b93a1" stroke-width="2" fill="none">
<path d="M172 74 L228 150"/><path d="M172 190 L228 190"/><path d="M172 306 L228 230"/>
<path d="M372 160 L428 90"/><path d="M372 220 L428 296"/>
<path d="M622 83h56"/><path d="M622 297h56"/></g>
<text x="400" y="372" font-size="12" fill="#b8bfcb">os dois SIEMs recebem o mesmo log em CEF e devem enxergar os mesmos eventos</text>
</g></svg>
